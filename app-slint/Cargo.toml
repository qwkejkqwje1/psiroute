[package]
name = "psiroute-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "psiroute-slint"
path = "src/main.rs"

[dependencies]
psi-engine = { path = "../crates/psi-engine" }
psi-config = { path = "../crates/psi-config" }
psi-core = { path = "../crates/psi-core" }
psi-psiphon = { path = "../crates/psi-psiphon" }
tokio.workspace = true
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-winit-software", "software-renderer-systemfonts", "system-tray", "unstable-winit-030"] }

[build-dependencies]
slint-build = "1.18"
