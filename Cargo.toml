[workspace]
resolver = "2"
members = ["crates/*", "app-slint"]
# Шаг 10: GUI — две сборки для сравнения Amy: app-slint (Slint, чистый Rust)
# и app-tauri (Tauri 2, добавляется отдельным членом воркспейса).

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bytes = "1"
async-trait = "0.1"
futures = "0.3"
socket2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
