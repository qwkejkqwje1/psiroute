name: PsiRoute CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Vet, Race Tests & Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet -mod=readonly ./...

      - name: Run tests with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -mod=readonly -buildvcs=false -count=1 -timeout 240s ./...

      - name: Build Windows binary
        run: go build -mod=readonly -trimpath -buildvcs=false -ldflags="-H=windowsgui -s -w" -o psiroute.exe .
