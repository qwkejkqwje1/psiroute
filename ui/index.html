<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PsiRoute — Aether Flow Dark</title>
  <style>
    :root {
      --bg-canvas: #080B12;
      --bg-surface: #111623;
      --bg-subtle: #161D2E;
      --bg-hover: #1E273D;
      --border-hairline: #232E47;
      --border-strong: #334155;
      --text-primary: #EDF2F7;
      --text-secondary: #CBD5E1;
      --text-muted: #94A3B8;
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.30), 0 8px 24px rgba(0, 0, 0, 0.26);
      --shadow-float: 0 12px 34px rgba(0, 0, 0, 0.48);
      --nav-bg: rgba(17, 22, 35, 0.88);
      --c-direct: #10B981;
      --c-dpi: #06B6D4;
      --c-warp: #F59E0B;
      --c-vpn: #6366F1;
      --c-clean: #14B8A6;
      --c-block: #F43F5E;
      --c-violet: #8B5CF6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background: var(--bg-canvas); color: var(--text-primary);
      font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', ui-monospace, monospace; }
    .container { max-width: 1320px; margin: 0 auto; width: 100%; }

    /* Floating Header */
    header.top-bar {
      position: sticky; top: 0; z-index: 40;
      padding: 12px 18px 8px;
    }
    .floating-nav {
      background: var(--nav-bg);
      border: 1px solid var(--border-hairline);
      box-shadow: var(--shadow-float);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.28); flex-shrink: 0;
    }
    .brand-title { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }
    .ver-pill {
      font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 6px;
      background: rgba(99, 102, 241, 0.16); color: #818CF8;
    }
    .mini-status { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; flex-shrink: 0; }

    .nav-tabs {
      display: flex; align-items: center; gap: 4px; padding: 4px;
      border-radius: 12px; background: var(--bg-subtle); border: 1px solid var(--border-hairline);
      overflow-x: auto;
    }
    .nav-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 14px; border-radius: 9px; border: 0; background: transparent;
      color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer;
      white-space: nowrap; transition: all 0.16s ease;
    }
    .nav-btn:hover { color: var(--text-primary); }
    .nav-btn.active { background: var(--bg-hover); color: #818CF8; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }

    .util-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 11px; border-radius: 11px;
      background: var(--bg-subtle); border: 1px solid var(--border-hairline);
      color: var(--text-secondary); font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 0.15s ease;
    }
    .pill-btn:hover { border-color: rgba(99, 102, 241, 0.65); color: var(--text-primary); }
    .pill-btn.active-cyan { background: rgba(6, 182, 212, 0.14); border-color: rgba(6, 182, 212, 0.45); color: #67E8F9; }
    .pill-btn.warn-btn { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.35); color: #FCD34D; }
    .pill-btn.warn-btn:hover { background: rgba(245, 158, 11, 0.22); }

    /* Workspace & Bento Grid */
    main { padding: 8px 18px 40px; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .grid-12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
    .col-5 { grid-column: span 5; }
    .col-7 { grid-column: span 7; }
    .col-6 { grid-column: span 6; }
    .col-12 { grid-column: span 12; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .grid-countries { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 8px; }

    @media (max-width: 1024px) {
      .col-5, .col-7, .col-6 { grid-column: span 12; }
      .grid-3 { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      box-shadow: var(--shadow-card);
      border-radius: 16px;
      padding: 18px;
      transition: border-color 0.2s ease;
    }
    .subtle {
      background: var(--bg-subtle);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .card-title { font-size: 14px; font-weight: 700; margin: 0; color: var(--text-primary); }
    .card-sub { font-size: 12px; color: var(--text-muted); margin: 2px 0 0; }

    /* Hero Power Button */
    .hero-row { display: flex; align-items: center; gap: 18px; }
    .power-wrap {
      position: relative; width: 94px; height: 94px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      border: 0; background: transparent; cursor: pointer; flex-shrink: 0;
    }
    .power-ring {
      position: absolute; inset: 0; border-radius: 999px;
      animation: powerPulse 2.4s ease-in-out infinite;
    }
    .power-spin {
      position: absolute; inset: 0; border-radius: 999px;
      border: 2px solid rgba(245, 158, 11, 0.25); border-top-color: #F59E0B;
      animation: spinSlow 1.1s linear infinite;
    }
    .power-core {
      position: relative; width: 82px; height: 82px; border-radius: 999px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      border: 2px solid var(--border-strong); background: var(--bg-subtle); color: var(--text-secondary);
      transition: all 0.2s ease;
    }
    .power-wrap.is-on .power-core { border-color: #10B981; background: rgba(16, 185, 129, 0.12); color: #34D399; }
    .power-wrap.is-on:hover .power-core { border-color: #F43F5E; background: rgba(244, 63, 94, 0.14); color: #FB7185; }
    .power-wrap.is-on .hover-off { display: none; }
    .power-wrap.is-on:hover .hover-on { display: none; }
    .power-wrap.is-on:hover .hover-off { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .power-wrap.is-busy .power-core { border-color: #F59E0B; background: rgba(245, 158, 11, 0.12); color: #FBBF24; }
    .power-cc { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: #10B981; color: #fff; }

    /* Chain Diagram */
    .chain-grid { display: grid; grid-template-columns: 1fr 38px 1fr 38px 1fr; align-items: center; gap: 0; }
    @media (max-width: 720px) { .chain-grid { grid-template-columns: 1fr; gap: 10px; } .flow-sep { display: none !important; } }
    .chain-node {
      text-align: left; padding: 13px; border-radius: 14px;
      background: var(--bg-subtle); border: 1px solid var(--border-hairline);
      cursor: pointer; transition: all 0.18s ease; width: 100%;
    }
    .chain-node:hover { border-color: var(--border-strong); }
    .chain-node.sel-ok { border-color: #10B981; background: rgba(16, 185, 129, 0.08); }
    .chain-node.sel-warn { border-color: #F59E0B; background: rgba(245, 158, 11, 0.08); }
    .chain-node.sel-vpn { border-color: #6366F1; background: rgba(99, 102, 241, 0.08); }
    .flow-sep { display: flex; align-items: center; padding: 0 4px; }
    .flow-track { width: 100%; height: 3px; border-radius: 99px; background: #1E293B; position: relative; overflow: hidden; }
    .flow-dot { position: absolute; top: 50%; width: 14px; height: 4px; margin-top: -2px; border-radius: 99px; animation: flowPacket 1.8s cubic-bezier(0.4,0,0.2,1) infinite; }
    .flow-dot-2 { animation-delay: 0.9s; }

    /* Buttons, Inputs, Badges, Segmented */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 13px; border-radius: 10px; border: 1px solid var(--border-hairline);
      background: var(--bg-subtle); color: var(--text-primary);
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    }
    .btn:hover { border-color: rgba(99, 102, 241, 0.6); background: var(--bg-hover); }
    .btn-primary { background: #4F46E5; border-color: #6366F1; color: #fff; }
    .btn-primary:hover { background: #4338CA; }
    .btn-ok { background: #059669; border-color: #10B981; color: #fff; }
    .btn-ok:hover { background: #047857; }
    .btn-cyan { background: rgba(6, 182, 212, 0.14); border-color: rgba(6, 182, 212, 0.35); color: #67E8F9; }
    .btn-cyan:hover { background: rgba(6, 182, 212, 0.24); }
    .btn-rose { background: rgba(244, 63, 94, 0.14); border-color: rgba(244, 63, 94, 0.35); color: #FDA4AF; }
    .btn-rose:hover { background: rgba(244, 63, 94, 0.24); }
    .btn-amber { background: #D97706; border-color: #F59E0B; color: #fff; }
    .btn-sm { padding: 5px 9px; font-size: 11px; border-radius: 8px; }

    .inp {
      width: 100%; padding: 9px 12px; border-radius: 11px;
      background: var(--bg-subtle); border: 1px solid var(--border-hairline);
      color: var(--text-primary); font-size: 12px; outline: none; transition: border-color 0.15s;
    }
    .inp:focus { border-color: #6366F1; }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
    }
    .b-ok { background: rgba(16, 185, 129, 0.14); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.25); }
    .b-dpi { background: rgba(6, 182, 212, 0.14); color: #67E8F9; border: 1px solid rgba(6, 182, 212, 0.25); }
    .b-warp { background: rgba(245, 158, 11, 0.14); color: #FCD34D; border: 1px solid rgba(245, 158, 11, 0.25); }
    .b-vpn { background: rgba(99, 102, 241, 0.16); color: #A5B4FC; border: 1px solid rgba(99, 102, 241, 0.28); }
    .b-clean { background: rgba(20, 184, 166, 0.16); color: #5EEAD4; border: 1px solid rgba(20, 184, 166, 0.30); }
    .b-block { background: rgba(244, 63, 94, 0.15); color: #FDA4AF; border: 1px solid rgba(244, 63, 94, 0.28); }
    .b-mut { background: rgba(148, 163, 184, 0.12); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.2); }

    .seg {
      display: inline-flex; align-items: center; gap: 2px; padding: 3px;
      border-radius: 10px; background: var(--bg-subtle); border: 1px solid var(--border-hairline);
      flex-wrap: wrap;
    }
    .seg button {
      border: 0; background: transparent; color: var(--text-muted);
      padding: 4px 8px; border-radius: 7px; font-size: 11px; font-weight: 600;
      cursor: pointer; transition: all 0.12s;
    }
    .seg button:hover { color: var(--text-primary); background: rgba(255,255,255,0.05); }
    .seg button.act-direct { background: #10B981; color: #fff; }
    .seg button.act-dpi { background: #06B6D4; color: #082F49; }
    .seg button.act-warp { background: #F59E0B; color: #1F1300; }
    .seg button.act-vpn { background: #6366F1; color: #fff; }
    .seg button.act-clean { background: #14B8A6; color: #042F2E; }
    .seg button.act-block { background: #F43F5E; color: #fff; }

    .switch {
      position: relative; width: 38px; height: 21px; border-radius: 999px; border: 0;
      background: #334155; cursor: pointer; flex-shrink: 0; transition: background 0.18s;
    }
    .switch.on { background: #10B981; }
    .switch::after {
      content: ''; position: absolute; top: 2px; left: 2px; width: 17px; height: 17px;
      border-radius: 999px; background: #fff; transition: transform 0.18s;
    }
    .switch.on::after { transform: translateX(17px); }

    .row-item {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-hairline);
    }
    .row-item:last-child { border-bottom: 0; padding-bottom: 0; }
    .row-item.warn-row { background: rgba(245, 158, 11, 0.06); border-left: 3px solid #F59E0B; padding: 10px 12px; border-radius: 8px; }

    .sc-card {
      position: relative; text-align: left; padding: 14px; border-radius: 14px;
      background: var(--bg-subtle); border: 1px solid var(--border-hairline);
      cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; justify-content: space-between;
    }
    .sc-card:hover { border-color: var(--border-strong); }
    .sc-card.active { background: rgba(99, 102, 241, 0.09); border-color: #6366F1; }

    .country-card {
      padding: 10px; border-radius: 12px; background: var(--bg-subtle);
      border: 1px solid var(--border-hairline); display: flex; align-items: center;
      justify-content: space-between; gap: 6px; cursor: pointer; transition: all 0.15s;
    }
    .country-card:hover { border-color: rgba(99, 102, 241, 0.6); }
    .country-card.active { border-color: #6366F1; background: rgba(99, 102, 241, 0.12); }
    .country-card.blocked { border-color: rgba(244, 63, 94, 0.45); background: rgba(244, 63, 94, 0.08); opacity: 0.78; }

    .icon-mini {
      border: 0; background: transparent; color: var(--text-muted); cursor: pointer;
      padding: 3px 5px; border-radius: 6px; font-size: 13px; line-height: 1;
    }
    .icon-mini:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }

    .toast-box {
      position: fixed; bottom: 16px; right: 16px; z-index: 60;
      display: flex; flex-direction: column; gap: 8px; max-width: 380px; pointer-events: none;
    }
    .toast {
      pointer-events: auto; padding: 10px 14px; border-radius: 12px;
      background: #161D2E; border: 1px solid var(--border-strong);
      color: var(--text-primary); font-size: 12px; font-weight: 500;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45); display: flex; align-items: center; gap: 8px;
      animation: fadeIn 0.18s ease-out;
    }

    @keyframes flowPacket { 0% { transform: translateX(-10px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(48px); opacity: 0; } }
    @keyframes powerPulse { 0%, 100% { transform: scale(1); opacity: 0.35; } 50% { transform: scale(1.1); opacity: 0.10; } }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 99px; }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="container floating-nav">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.5L19.5 5.5V11C19.5 16 16.5 19.5 12 21.5C7.5 19.5 4.5 16 4.5 11V5.5L12 2.5Z"/>
            <path d="M8.8 12.2L11.1 14.5L15.6 9.8"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">PsiRoute <span id="hdr-ver" class="ver-pill mono">v2.4.0</span></div>
          <div id="hdr-mini" class="mini-status"><span class="dot" style="background:#94A3B8"></span><span>Загрузка…</span></div>
        </div>
      </div>

      <nav id="primary-nav" class="nav-tabs"></nav>

      <div class="util-group">
        <button id="btn-proxy-pill" class="pill-btn mono" onclick="copyProxy()" title="Локальный SOCKS5/HTTP прокси всегда активен (включая проброс по IP)">
          <span class="dot" style="background:#10B981"></span>
          <span id="hdr-proxy">127.0.0.1:1080</span>
        </button>
        <button id="btn-privacy" class="pill-btn" onclick="togglePrivacy()">Чистый экран</button>
        <button class="pill-btn warn-btn" onclick="resetStack()" title="Сбросить DNS, маршруты и перезапустить стек">Reset Stack</button>
      </div>
    </div>
  </header>

  <div class="container" id="notices"></div>
  <main class="container" id="root"></main>
  <div id="toasts" class="toast-box"></div>

  <script>
    const TOKEN = '__PSIROUTE_TOKEN__';
    const COUNTRIES = [
      ['AUTO','Авто (лучшая)'],['NL','Нидерланды'],['DE','Германия'],['FI','Финляндия'],
      ['SE','Швеция'],['GB','Великобритания'],['US','США'],['CH','Швейцария'],
      ['FR','Франция'],['PL','Польша'],['CZ','Чехия'],['AT','Австрия'],
      ['NO','Норвегия'],['DK','Дания'],['BE','Бельгия'],['IE','Ирландия'],
      ['EE','Эстония'],['LV','Латвия'],['LT','Литва'],['IT','Италия'],
      ['ES','Испания'],['RO','Румыния'],['BG','Болгария'],['HU','Венгрия'],
      ['TR','Турция'],['SG','Сингапур'],['JP','Япония'],['CA','Канада']
    ];
    const ROUTE_META = {
      'direct':     { label: 'Direct',   full: 'Напрямую',          cls: 'b-ok',    act: 'act-direct' },
      'direct-dpi': { label: 'DPI',      full: 'Обход DPI',         cls: 'b-dpi',   act: 'act-dpi' },
      'warp':       { label: 'WARP',     full: 'WARP',              cls: 'b-warp',  act: 'act-warp' },
      'psiphon':    { label: 'VPN',      full: 'Psiphon VPN',       cls: 'b-vpn',   act: 'act-vpn' },
      'clean-ip':   { label: 'Clean-IP', full: 'WARP→VPN→WARP',     cls: 'b-clean', act: 'act-clean' },
      'block':      { label: 'Блок',     full: 'Блок',              cls: 'b-block', act: 'act-block' },
    };

    const ui = {
      ws: 'dashboard', // dashboard | routes | streams | network
      routesTab: 'rules', // rules | apps | lists
      netTab: 'countries', // countries | proxy | settings | logs
      privacy: false,
      chainNode: null,
      omnibox: '',
      omniboxOb: 'psiphon',
      omniboxTrace: null,
      ruleSearch: '',
      newRuleName: '',
      newRuleTarget: '',
      newRuleOb: 'psiphon',
      streamFilter: 'all',
      streamSearch: '',
      streamTarget: 'domain',
      streamPaused: false,
      countrySearch: '',
      diagHost: '2ip.io',
      diagBusy: false,
      diagRes: null,
      verifyBusy: false,
      verifyRes: null,
      leakBusy: false,
      leakRes: null,
      logFilter: 'all',
      speedHist: Array.from({ length: 24 }, () => ({ d: 0, u: 0 })),
      state: null,
      rules: [],
      apps: [],
      lists: [],
      conns: [],
      share: null,
    };

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function mask(s) {
      if (!ui.privacy || !s) return String(s || '');
      let o = String(s).replace(/\b\d{1,3}(?:\.\d{1,3}){3}\b/g, '***.***.***.***');
      return o.replace(/\b([a-zA-Z0-9-]{2,})(\.[a-zA-Z0-9-]+)+\b/g, m => m.endsWith('.exe') ? m : m[0] + '•••••.' + m.split('.').pop());
    }
    function fmtSpeed(bps) {
      const kb = (bps || 0) / 1024;
      if (kb >= 1024) return (kb / 1024).toFixed(1) + ' МБ/с';
      return Math.round(kb) + ' КБ/с';
    }
    function fmtBytes(b) {
      b = b || 0;
      if (b >= 1073741824) return (b / 1073741824).toFixed(2) + ' ГБ';
      if (b >= 1048576) return (b / 1048576).toFixed(1) + ' МБ';
      if (b >= 1024) return (b / 1024).toFixed(1) + ' КБ';
      return b + ' Б';
    }
    function toast(msg, color = '#6366F1') {
      const box = document.getElementById('toasts');
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<span class="dot" style="background:${color}"></span><span>${esc(msg)}</span>`;
      box.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, 2800);
    }
    function copyText(text, msg) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
          document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        }
      } catch (e) {}
      toast(msg || ('Скопировано: ' + text), '#10B981');
    }
    async function api(method, path, body) {
      const opts = { method, headers: { 'X-Psiroute': TOKEN } };
      if (body !== undefined && body !== null) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const r = await fetch('/api/' + path, opts);
      const data = await r.json().catch(() => ({}));
      if (!r.ok || data.ok === false) {
        throw new Error(data.error || ('HTTP ' + r.status));
      }
      return data;
    }

      try {
        const st = await api('GET', 'state?compact=' + (ui.ws === 'network' && ui.netTab === 'logs' ? '0' : '1'));
        ui.state = st;
        renderNotices(st);
        const stats = st.stats || {};
        ui.speedHist.push({ d: stats.down_bps || 0, u: stats.up_bps || 0 });
        if (ui.speedHist.length > 24) ui.speedHist.shift();
        if (st.clean_chain && st.clean_chain.last_verify && !ui.verifyRes) {
          ui.verifyRes = st.clean_chain.last_verify;
        }
        renderChrome();
        if (ui.ws === 'dashboard') updateDashboardLive();

      } catch (e) {}
    }

      try {
        if (ui.ws === 'routes') {
          if (ui.routesTab === 'rules') {
            const d = await api('GET', 'rules');
            ui.rules = d.rules || [];
          } else if (ui.routesTab === 'apps') {

          ui.share = await api('GET', 'share').catch(() => null);

    async function addOmniboxRule() {

      const isApp = target.toLowerCase().endsWith('.exe');
      const rule = { name: target, outbound: ui.omniboxOb };
      if (isApp) rule.apps = [target];
      else if (/^\d+\.\d+\.\d+\.\d+(\/\d+)?$/.test(target)) rule.cidr = [target.includes('/') ? target : target + '/32'];
      else rule.domains = [target];
      try {
        await api('POST', 'rules/add', rule);
        toast('Правило добавлено: ' + target + ' → ' + ui.omniboxOb, '#10B981');
        ui.omnibox = ''; ui.omniboxTrace = null;
        pollState(); renderWorkspace();

      const t = ui.newRuleTarget.trim();
      if (!t) { toast('Укажите домен, IP/CIDR или .exe', '#F59E0B'); return; }
      const parts = t.split(',').map(s => s.trim()).filter(Boolean);
      const rule = { name: ui.newRuleName.trim() || parts[0], outbound: ui.newRuleOb, domains: [], cidr: [], apps: [], lists: [] };
      parts.forEach(p => {
        if (p.toLowerCase().endsWith('.exe')) rule.apps.push(p);
        else if (p.startsWith('list:')) rule.lists.push(p.slice(5));
        else if (/^\d+\.\d+\.\d+\.\d+(\/\d+)?$/.test(p)) rule.cidr.push(p.includes('/') ? p : p + '/32');
        else rule.domains.push(p);
      });
      try {
        await api('POST', 'rules/add', rule);
        ui.newRuleName = ''; ui.newRuleTarget = '';
        toast('Правило сохранено', '#10B981'); loadTabData();
      } catch (e) { toast(e.message, '#F43F5E'); }

    function speedSVG() {
      const w = 420, h = 68, hist = ui.speedHist;
      const mx = Math.max(65536, ...hist.map(p => Math.max(p.d, p.u)));
      const pts = key => hist.map((p, i) => `${((i/(hist.length-1))*w).toFixed(1)},${(h - 4 - (p[key]/mx)*(h-10)).toFixed(1)}`).join(' ');
      const pd = pts('d'), pu = pts('u');
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:70px;display:block">
        <defs><linearGradient id="gD" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10B981" stop-opacity="0.30"/><stop offset="100%" stop-color="#10B981" stop-opacity="0"/></linearGradient></defs>
        <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
        <polygon points="0,${h} ${pd} ${w},${h}" fill="url(#gD)"/>
        <polyline points="${pd}" fill="none" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>
        <polyline points="${pu}" fill="none" stroke="#6366F1" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>`;
    }

        dl.textContent = '↓ ' + fmtSpeed(stats.down_bps);
        ul.textContent = '↑ ' + fmtSpeed(stats.up_bps);
        tot.textContent = 'Σ ' + fmtBytes((stats.session_rx || 0) + (stats.session_tx || 0));
        svg.innerHTML = speedSVG();

        renderWorkspace();
      }

      const reg = psi.egress || psi.region || 'AUTO';
      const capMode = tun.on ? 'tun' : (st.sysproxy ? 'sysproxy' : 'manual');
      const capTitle = capMode === 'tun' ? 'TUN (Wintun)' : (capMode === 'sysproxy' ? 'Системный прокси' : 'Прокси 127.0.0.1:1080');
      const ksMode = st.kill_switch_mode || 'off';
      const favs = st.favorite_countries || ['NL','DE','FI','US','GB'];

      return `<div class="stack">
        <div class="grid-12">
          <!-- HERO CARD -->

                <div class="card-sub">${esc(psi.protocol || 'OSSH / TLS')} · Прокси <span class="mono">${esc(mask(st.listen || '127.0.0.1:1080'))}</span> активен</div>

                </div>
                <div style="font-size:13px;font-weight:700">Cloudflare WARP</div>
                <div style="font-size:11px;color:${st.warp_on?'#FCD34D':'var(--text-muted)'};margin-top:3px">${cc.enabled ? 'Каскад Clean-IP' : (st.warp_on ? 'Активен' : 'Выключен')}</div>

              <div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:600">Подложка WARP</span><button class="switch ${st.warp_on?'on':''}" onclick="toggleWarp()"></button></div>
              <div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:600">Clean-IP (WARP→VPN→WARP)</span><button class="switch ${cc.enabled?'on':''}" onclick="toggleCleanChain('enabled')"></button></div>
              <button class="btn btn-sm btn-cyan" onclick="ui.netTab='countries';setWs('network');verifyCleanChain()">Проверить связку</button>

            ${ui.chainNode === 'exit' ? `<div class="subtle" style="margin-top:12px;padding:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">
              ${['AUTO', ...favs].map(c => `<button class="btn btn-sm ${reg===c?'btn-primary':''}" onclick="setRegion('${c}')">${flagSVG(c,16,11)} ${c}</button>`).join('')}
              <button class="btn btn-sm" style="margin-left:auto" onclick="ui.netTab='countries';setWs('network')">Все страны и ЧС →</button>

            <div class="card-head"><h2 class="card-title">Сценарий маршрутизации</h2><span style="font-size:11px;color:var(--text-muted)">Политика ядра</span></div>
            <div class="grid-3">
              ${[
                ['auto','Умный обход ТСПУ','Рекомендуемый','РФ напрямую, DPI для блоков, VPN для жёстких блокировок','b-dpi'],
                ['rules','По моим правилам','Строгий','В VPN/Clean-IP только выбранные сайты, IP и .exe','b-vpn'],
                ['psiphon','Весь трафик в VPN','Глобальный','100% трафика через Psiphon; исключения напрямую','b-clean']
              ].map(([id, t, b, d, bc]) => `
                <button class="sc-card ${st.mode===id?'active':''}" onclick="setScenario('${id}')">
                  <div>
                    <span class="badge ${bc}" style="margin-bottom:8px">${b}</span>
                    <div style="font-size:13px;font-weight:700">${t}</div>
                  </div>
                  <div style="font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.45">${d}</div>
                </button>`).join('')}

          </section>

          <section class="card col-5" style="display:flex;flex-direction:column;justify-content:space-between">
            <div>
              <div class="card-head"><h2 class="card-title">Инспектор и быстрое правило</h2><span class="mono" style="font-size:11px;color:var(--text-muted)">Live Trace</span></div>
              <input class="inp mono" value="${esc(ui.omnibox)}" oninput="onOmniboxInput(this.value)" onkeydown="if(event.key==='Enter')addOmniboxRule()" placeholder="Домен (2ip.io), IP (1.1.1.1) или Discord.exe…" />
              <div id="omni-trace" class="subtle" style="margin-top:10px;padding:9px 11px;font-size:11px;min-height:38px"></div>
            </div>
            <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border-hairline);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
              ${segButtons(ui.omniboxOb, "ui.omniboxOb='{ob}';renderWorkspace()")}
              <button class="btn btn-primary btn-sm" onclick="addOmniboxRule()">+ Сохранить</button>
            </div>
          </section>
        </div>

        <!-- TELEMETRY + PROXY QUICK BAR -->
        <div class="grid-12">
          <section class="card col-5">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
              <div style="display:flex;gap:14px">
                <span id="live-dl" class="mono" style="font-size:12px;font-weight:700;color:#34D399">↓ ${fmtSpeed(stats.down_bps)}</span>
                <span id="live-ul" class="mono" style="font-size:12px;font-weight:700;color:#818CF8">↑ ${fmtSpeed(stats.up_bps)}</span>
              </div>
              <span id="live-tot" class="mono" style="font-size:11px;color:var(--text-muted)">Σ ${fmtBytes((stats.session_rx||0)+(stats.session_tx||0))}</span>
            </div>
            <div id="live-svg" class="subtle" style="padding:4px">${speedSVG()}</div>
          </section>

          <section class="card col-7" style="display:flex;flex-direction:column;justify-content:space-between">
            <div class="card-head">
              <div>
                <h2 class="card-title">Локальный прокси-шлюз (всегда активен)</h2>
                <p class="card-sub">Проброс любого трафика, браузеров, Telegram и прямых IP-адресов в любом режиме (включая TUN)</p>

              <span class="badge b-ok mono">ONLINE</span>

            <div style="display:flex;flex-wrap:wrap;gap:8px">
              <button class="btn mono" onclick="copyText('${esc(st.listen||'127.0.0.1:1080')}','Адрес скопирован')">${esc(mask(st.listen||'127.0.0.1:1080'))}</button>
              <button class="btn mono" onclick="copyText('${esc(st.proxy_socks5||'socks5://127.0.0.1:1080')}','SOCKS5 скопирован')">SOCKS5</button>
              <button class="btn mono" onclick="copyText('${esc(st.proxy_http||'http://127.0.0.1:1080')}','HTTP скопирован')">HTTP</button>
              <button class="btn btn-ok" style="margin-left:auto" onclick="ui.netTab='logs';setWs('network');runLeakTest()">🛡 Тест утечек (1 клик)</button>
              <button class="btn btn-cyan" onclick="ui.netTab='countries';setWs('network');verifyCleanChain()">WARP→VPN→WARP</button>
            </div>
          </section>
        </div>
      </div>`;
    }

    function renderRoutes() {
      const subNav = `<div class="seg" style="margin-bottom:14px">
        <button class="${ui.routesTab==='rules'?'act-vpn':''}" onclick="ui.routesTab='rules';loadTabData()">Правила (${ui.rules.length})</button>
        <button class="${ui.routesTab==='apps'?'act-vpn':''}" onclick="ui.routesTab='apps';loadTabData()">Программы (.exe)</button>
        <button class="${ui.routesTab==='lists'?'act-vpn':''}" onclick="ui.routesTab='lists';loadTabData()">Списки доменов</button>
      </div>`;

      if (ui.routesTab === 'rules') {
        const q = ui.ruleSearch.toLowerCase();
        const rows = ui.rules.map((r, i) => ({ r, i })).filter(({ r }) => {
          const blob = [r.name, ...(r.domains||[]), ...(r.cidr||[]), ...(r.apps||[]), ...(r.lists||[])].join(' ').toLowerCase();
          return !q || blob.includes(q);
        });
        return subNav + `<div class="stack">
          <div class="card">
            <div class="grid-3" style="margin-bottom:10px">
              <input class="inp" value="${esc(ui.newRuleName)}" oninput="ui.newRuleName=this.value" placeholder="Название правила" />
              <input class="inp mono" style="grid-column:span 2" value="${esc(ui.newRuleTarget)}" oninput="ui.newRuleTarget=this.value" placeholder="2ip.io, 1.1.1.1/32, Discord.exe, list:ai-services" />
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
              ${segButtons(ui.newRuleOb, "ui.newRuleOb='{ob}';renderWorkspace()")}
              <div style="display:flex;gap:8px;align-items:center">
                <input class="inp" style="width:200px" value="${esc(ui.ruleSearch)}" oninput="ui.ruleSearch=this.value;renderWorkspace()" placeholder="Поиск по правилам…" />
                <button class="btn btn-ok" onclick="addRuleFromForm()">+ Добавить</button>
              </div>
            </div>
          </div>
          <div class="card">
            ${rows.map(({ r, i }) => {
              const target = [...(r.domains||[]), ...(r.cidr||[]), ...(r.apps||[]), ...(r.lists||[]).map(x=>'list:'+x)].join(', ');
              const rm = ROUTE_META[r.outbound] || { full: r.outbound, cls: 'b-mut' };
              return `<div class="row-item" style="${r.disabled?'opacity:.5':''}">
                <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
                  <button class="switch ${!r.disabled?'on':''}" onclick="toggleRule(${i})"></button>
                  <div style="min-width:0">
                    <div style="font-size:13px;font-weight:600">${esc(mask(r.name || target))} <span class="badge ${rm.cls}">${esc(rm.full)}</span></div>
                    <div class="mono" style="font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis">${esc(mask(target))}</div>
                  </div>
                </div>
                <button class="btn btn-sm btn-rose" onclick="deleteRule(${i})">Удалить</button>
              </div>`;
            }).join('') || '<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:12px">Правил не найдено</div>'}
          </div>
        </div>`;
      }

      if (ui.routesTab === 'apps') {
        return subNav + `<div class="card">
          <div class="card-head"><h2 class="card-title">Приложения (Split Tunneling)</h2><span class="card-sub">Работает при включённом Wintun TUN</span></div>
          ${ui.apps.map(a => `<div class="row-item">
            <div>
              <div style="font-size:13px;font-weight:600">${esc(a.title || a.exe)}</div>
              <div class="mono" style="font-size:11px;color:var(--text-muted)">${esc(a.exe)}</div>
            </div>
            ${segButtons(a.outbound || '', `setAppOutbound('${esc(a.exe)}','{ob}')`)}
          </div>`).join('') || '<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:12px">Список программ пуст</div>'}
        </div>`;
      }

      return subNav + `<div class="card">
        <div class="card-head">
          <h2 class="card-title">Списки доменов и подсетей</h2>
          <button class="btn btn-sm" onclick="api('POST','lists/refresh').then(()=>{toast('Списки обновлены','#10B981');loadTabData()})">↻ Обновить все</button>
        </div>
        <div class="grid-2">
          ${ui.lists.map(l => `<div class="subtle" style="padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px">
            <div>
              <div style="font-size:13px;font-weight:700">${esc(l.title || l.id)}</div>
              <div class="mono" style="font-size:11px;color:var(--text-muted)">list:${esc(l.id)} · доменов: ${l.domains||0} · CIDR: ${l.cidrs||0}</div>
            </div>
            <button class="btn btn-sm btn-cyan" onclick="ui.newRuleName='${esc(l.title||l.id)}';ui.newRuleTarget='list:${esc(l.id)}';ui.routesTab='rules';loadTabData()">+ В правило</button>
          </div>`).join('')}
        </div>
      </div>`;
    }

    function renderStreams() {
      const q = ui.streamSearch.toLowerCase();
      const rows = ui.conns.filter(c => {
        if (ui.streamFilter === 'live' && !c.live) return false;
        if (ui.streamFilter === 'warn' && !c.err) return false;
        if (ui.streamFilter === 'block' && c.outbound !== 'block') return false;
        if (q && !(String(c.app||'') + ' ' + String(c.host||'') + ' ' + String(c.rule||'')).toLowerCase().includes(q)) return false;
        return true;
      });
      return `<div class="stack">
        <div class="card" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between">
          <div class="seg">
            <button class="${ui.streamFilter==='all'?'act-vpn':''}" onclick="ui.streamFilter='all';renderWorkspace()">Все (${ui.conns.length})</button>
            <button class="${ui.streamFilter==='live'?'act-direct':''}" onclick="ui.streamFilter='live';renderWorkspace()">Активные</button>
            <button class="${ui.streamFilter==='warn'?'act-warp':''}" onclick="ui.streamFilter='warn';renderWorkspace()">Сбросы</button>
            <button class="${ui.streamFilter==='block'?'act-block':''}" onclick="ui.streamFilter='block';renderWorkspace()">Блок</button>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <div class="seg">
              <button class="${ui.streamTarget==='domain'?'act-vpn':''}" onclick="ui.streamTarget='domain';renderWorkspace()">Клик = сайт/IP</button>
              <button class="${ui.streamTarget==='app'?'act-vpn':''}" onclick="ui.streamTarget='app';renderWorkspace()">Клик = .exe</button>
            </div>
            <input class="inp" style="width:200px" value="${esc(ui.streamSearch)}" oninput="ui.streamSearch=this.value;renderWorkspace()" placeholder="Фильтр потоков…" />
            <button class="btn btn-sm ${ui.streamPaused?'btn-amber':''}" onclick="ui.streamPaused=!ui.streamPaused;renderWorkspace()">${ui.streamPaused?'▶ Продолжить':'⏸ Пауза'}</button>
          </div>
        </div>
        <div class="card">
          ${rows.map(c => `<div class="row-item ${c.err?'warn-row':''}">
            <div style="min-width:0;flex:1">
              <div class="mono" style="font-size:12px;font-weight:600">
                <span class="dot" style="background:${c.live?'#10B981':'#64748B'};margin-right:6px"></span>
                ${esc(c.app || 'system')} → <span style="color:#818CF8">${esc(mask(c.host))}</span>:${c.port||0}
                <span class="badge b-mut">${esc((c.proto||'tcp').toUpperCase())}</span>
              </div>
              <div style="font-size:11px;color:var(--text-muted);margin-top:3px">
                Правило: ${esc(c.rule||'—')} · ↓ ${fmtBytes(c.rx)} · ↑ ${fmtBytes(c.tx)} ${c.err ? '· ⚠ ' + esc(c.err) : ''}
              </div>
            </div>
            ${segButtons(c.outbound || '', `quickConnRule('${esc(c.host)}','${esc(c.app||'')}','{ob}')`)}
          </div>`).join('') || '<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:12px">Нет активных соединений</div>'}
        </div>
      </div>`;
    }

    function renderVerifyBox() {
      if (ui.verifyBusy) {
        return `<div class="subtle" style="margin-top:12px;padding:14px;font-size:12px;color:#67E8F9">⏳ Проверяем 3 звена: Entry WARP → Psiphon VPN → Exit WARP (Cloudflare trace)…</div>`;
      }
      const v = ui.verifyRes;
      if (!v) return '';
      const hopCard = (h) => {
        if (!h) return '';
        const ok = !!h.ok;
        const bypassed = !!h.bypassed;
        return `<div class="subtle" style="padding:12px;border-color:${ok?'rgba(16,185,129,0.4)':(bypassed?'rgba(245,158,11,0.35)':'rgba(244,63,94,0.4)')}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:12px;font-weight:700">${esc(h.name || '')}</span>
            <span class="badge ${ok?'b-ok':(bypassed?'b-warp':'b-block')}">${ok ? (h.ms + ' мс') : (bypassed ? 'AUTO-BYPASS' : 'ОШИБКА')}</span>
          </div>
          ${ok ? `<div class="mono" style="font-size:11px;color:var(--text-secondary)">
            IP: <b>${esc(mask(h.ip))}</b> · ${esc(h.loc||'?')} (${esc(h.colo||'?')})<br/>
            Cloudflare WARP: <b style="color:${(h.warp==='on'||h.warp==='plus')?'#34D399':'#94A3B8'}">${esc(h.warp||'off')}</b>
          </div>` : `<div style="font-size:11px;color:var(--text-muted)">${esc(h.note || h.error || 'Недоступно')}</div>`}
        </div>`;
      };
      return `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-hairline)">
        <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px">
          <span class="badge ${v.verified?'b-ok':'b-warp'}">${v.verified ? '✓ СВЯЗКА WARP → VPN → WARP ПОДТВЕРЖДЕНА' : '⚠ СВЯЗКА НЕ ПОДТВЕРЖДЕНА ПОЛНОСТЬЮ'}</span>
          ${v.ip_changed ? '<span class="badge b-clean">Выходной IP заменён на чистый</span>' : ''}
          ${v.warp_confirmed ? '<span class="badge b-ok">warp=on подтверждён</span>' : ''}
          ${v.error ? `<span style="font-size:11px;color:#FDA4AF">${esc(v.error)}</span>` : ''}
        </div>
        <div class="grid-3">${hopCard(v.hop1)}${hopCard(v.hop2)}${hopCard(v.hop3)}</div>
      </div>`;
    }

    function renderNetwork() {
      const st = ui.state || {};
      const cc = st.clean_chain || {};
      const psi = st.psiphon || {};
      const favs = st.favorite_countries || [];
      const blocked = st.blocked_countries || [];
      const ksMode = st.kill_switch_mode || 'off';
      const subNav = `<div class="seg" style="margin-bottom:14px">
        <button class="${ui.netTab==='countries'?'act-vpn':''}" onclick="ui.netTab='countries';loadTabData()">Страны, ЧС и WARP→VPN→WARP</button>
        <button class="${ui.netTab==='proxy'?'act-vpn':''}" onclick="ui.netTab='proxy';loadTabData()">Прокси (:1080) и LAN</button>
        <button class="${ui.netTab==='settings'?'act-vpn':''}" onclick="ui.netTab='settings';loadTabData()">Параметры и DNS</button>
        <button class="${ui.netTab==='logs'?'act-vpn':''}" onclick="ui.netTab='logs';pollState();renderWorkspace()">Журнал и Диагностика</button>
      </div>`;

      if (ui.netTab === 'countries') {
        const q = ui.countrySearch.toLowerCase();
        const list = COUNTRIES.filter(([code, name]) => !q || (code + ' ' + name).toLowerCase().includes(q));
        return subNav + `<div class="stack">
          <!-- CLEAN-IP CASCADE + VERIFY + WFP KILL SWITCH -->
          <div class="card">
            <div class="card-head">
              <div>
                <h2 class="card-title">Каскад «Чистый IP» (WARP → Psiphon → WARP) и WFP Kill Switch</h2>
                <p class="card-sub mono">Цепочка: ${esc(cc.hops || 'WARP → PSI → WARP')} · MTU 1280 → 1200 · TCP MSS ≤ 1140</p>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
                <div class="subtle" style="padding:6px 10px;display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:600">Clean-IP</span><button class="switch ${cc.enabled?'on':''}" onclick="toggleCleanChain('enabled')"></button></div>
                <div class="subtle" style="padding:6px 10px;display:flex;align-items:center;gap:8px"><span style="font-size:12px;font-weight:600">Auto-Chain</span><button class="switch ${cc.auto_chain?'on':''}" onclick="toggleCleanChain('auto_chain')"></button></div>
                <button class="btn btn-cyan" onclick="verifyCleanChain()">${ui.verifyBusy ? '⏳ Проверка…' : '✓ Проверить связку WARP→VPN→WARP'}</button>
                <div class="seg">
                  <button class="${ksMode==='off'?'act-vpn':''}" onclick="setSetting('routing.kill_switch_mode','off')">KS Off</button>
                  <button class="${ksMode==='auto'?'act-warp':''}" onclick="setSetting('routing.kill_switch_mode','auto')">KS Auto</button>
                  <button class="${ksMode==='strict'?'act-block':''}" onclick="setSetting('routing.kill_switch_mode','strict')">KS Strict</button>
                </div>
              </div>
            </div>
            ${renderVerifyBox()}
          </div>

          <!-- COUNTRIES + BLACKLIST -->
          <div class="card">
            <div class="card-head">
              <div>
                <h2 class="card-title">Страны выхода и Чёрный список</h2>
                <p class="card-sub">★ — закрепить в избранном · ⊘ — добавить в чёрный список (исключить из Авто-выбора)</p>
              </div>
              <input class="inp" style="width:220px" value="${esc(ui.countrySearch)}" oninput="ui.countrySearch=this.value;renderWorkspace()" placeholder="Найти страну…" />
            </div>
            ${blocked.length ? `<div class="subtle" style="padding:10px 12px;margin-bottom:12px;border-color:rgba(244,63,94,0.35);display:flex;flex-wrap:wrap;gap:6px;align-items:center">
              <span style="font-size:11px;font-weight:700;color:#FDA4AF">⊘ Чёрный список (${blocked.length}):</span>
              ${blocked.map(c => `<button class="btn btn-sm btn-rose" onclick="toggleBlockCountry('${c}')">${flagSVG(c,15,10)} ${c} ✕</button>`).join('')}
            </div>` : ''}
            <div class="grid-countries">
              ${list.map(([code, name]) => {
                const isAct = (psi.region || 'AUTO') === code || (code === 'AUTO' && !psi.region);
                const isFav = favs.includes(code);
                const isBlk = blocked.includes(code);
                return `<div class="country-card ${isAct?'active':''} ${isBlk?'blocked':''}" onclick="setRegion('${code}')">
                  <div style="display:flex;align-items:center;gap:8px;min-width:0">
                    ${flagSVG(code, 20, 14)}
                    <div style="min-width:0">
                      <div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(name)}</div>
                      <div class="mono" style="font-size:10px;color:${isBlk?'#FDA4AF':'var(--text-muted)'}">${isBlk ? 'В ЧЁРНОМ СПИСКЕ' : code}</div>
                    </div>
                  </div>
                  ${code !== 'AUTO' ? `<div style="display:flex;gap:2px;flex-shrink:0">
                    <button class="icon-mini" style="color:${isFav?'#FBBF24':''}" onclick="toggleFav('${code}',event)" title="В избранное">${isFav?'★':'☆'}</button>
                    <button class="icon-mini" style="color:${isBlk?'#FB7185':''}" onclick="toggleBlockCountry('${code}',event)" title="В чёрный список">⊘</button>
                  </div>` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>`;
      }

      if (ui.netTab === 'proxy') {
        const listen = st.listen || '127.0.0.1:1080';
        const uiAddr = st.ui || '127.0.0.1:9090';
        const rows = [
          ['Локальный прокси (IP/TCP/UDP)', listen],
          ['SOCKS5 URL', 'socks5://' + listen],
          ['HTTP / HTTPS URL', 'http://' + listen],
          ['Автонастройка (PAC)', 'http://' + uiAddr + '/proxy.pac'],
        ];
        const sh = ui.share || {};
        return subNav + `<div class="grid-2">
          <div class="card">
            <div class="card-head">
              <div><h2 class="card-title">Локальный прокси 127.0.0.1:1080</h2><p class="card-sub">Всегда запущен и принимает подключения по доменам и прямым IP-адресам даже при включённом TUN</p></div>
              <span class="badge b-ok">ВСЕГДА ВКЛ</span>
            </div>
            <div class="stack" style="gap:8px">
              ${rows.map(([l, v]) => `<button class="subtle" style="padding:11px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--text-primary);width:100%" onclick="copyText('${esc(v)}','Скопировано: ${esc(v)}')">
                <span style="font-size:12px;color:var(--text-muted)">${l}</span>
                <span class="mono" style="font-size:12px;font-weight:600">${esc(mask(v))}</span>
              </button>`).join('')}
            </div>
          </div>
          <div class="card">
            <div class="card-head">
              <div><h2 class="card-title">Раздача в локальную сеть (LAN)</h2><p class="card-sub">Подключите смартфон, Smart TV или второй ПК по IP</p></div>
              <button class="switch ${st.share_on?'on':''}" onclick="toggleShare()"></button>
            </div>
            ${st.share_on ? `<div class="subtle" style="padding:12px;font-size:12px" class="mono">
              Адрес: <b class="mono">${esc(mask(sh.addr || 'LAN:1081'))}</b><br/>
              Логин: <b class="mono">${esc(sh.user || 'psiroute')}</b> · Пароль: <b class="mono">${ui.privacy?'••••••':esc(sh.password || '—')}</b>
            </div>` : '<div class="subtle" style="padding:16px;text-align:center;font-size:12px;color:var(--text-muted)">Включите раздачу, чтобы открыть прокси для других устройств в домашней сети.</div>'}
          </div>
        </div>`;
      }

      if (ui.netTab === 'settings') {
        const items = [
          ['Режим TUN (Wintun)', 'Весь трафик ПК и игр + FakeIP', !!(st.tun && st.tun.on), "setSetting('tun.enabled', " + !(st.tun && st.tun.on) + ")"],
          ['Системный прокси Windows', 'Автоматическая проксификация браузеров', !!st.sysproxy, "setSetting('general.system_proxy', " + !st.sysproxy + ")"],
          ['Подложка Cloudflare WARP', 'AmneziaWG I1–I5 обфускация входа', !!st.warp_on, "toggleWarp()"],
          ['Шифрованный DNS (DoH + ECH)', 'Защита от подмены DNS провайдером', !!st.dns_on, "setSetting('dns.enabled', " + !st.dns_on + ")"],
          ['FakeIP (198.19.x.y)', 'Мгновенный резолвинг без коллизий с другими VPN', !!st.fake_ip, "setSetting('tun.fake_ip', " + !st.fake_ip + ")"],
          ['Блокировать QUIC (UDP 443)', 'Перевод HTTP/3 на TCP + обход DPI', !!st.block_quic, "setSetting('routing.block_quic', " + !st.block_quic + ")"],
          ['Защита WebRTC / STUN', 'Блокировка утечки реального IP по UDP', !!st.block_stun, "setSetting('routing.block_stun', " + !st.block_stun + ")"],
          ['Локальная сеть напрямую', 'Роутер, NAS и RFC1918 без VPN', !!st.bypass_lan, "setSetting('routing.bypass_lan', " + !st.bypass_lan + ")"],
          ['Автозапуск с Windows', 'Запуск при входе в систему', !!st.autostart_on, "toggleAutostart(" + !st.autostart_on + ")"],
        ];
        return subNav + `<div class="card"><div class="grid-2">
          ${items.map(([t, s, on, act]) => `<div class="subtle" style="padding:12px;display:flex;justify-content:space-between;align-items:center;gap:12px">
            <div><div style="font-size:13px;font-weight:600">${t}</div><div style="font-size:11px;color:var(--text-muted)">${s}</div></div>
            <button class="switch ${on?'on':''}" onclick="${act}"></button>
          </div>`).join('')}
        </div></div>`;
      }

      const logs = (st.log || []).filter(l => ui.logFilter === 'all' || (ui.logFilter === 'warn' ? (l.level==='warn'||l.level==='error') : l.level==='error'));
      return subNav + `<div class="stack">
        <div class="card">
          <div class="card-head">
            <div>
              <h2 class="card-title">Тест утечек и конфликтов среды (1 клик)</h2>
              <p class="card-sub">Проверка внешнего IP, DNS/Split-DNS, IPv6 blackhole, WebRTC/STUN, WFP Kill Switch и чужих VPN-адаптеров</p>
            </div>
            <button class="btn btn-ok" onclick="runLeakTest()">${ui.leakBusy ? '⏳ Проверяем…' : '🛡 Запустить тест утечек'}</button>
          </div>
          ${ui.leakRes ? `<div class="stack" style="gap:8px;margin-top:8px">
            <div style="display:flex;gap:8px;align-items:center">
              <span class="badge ${ui.leakRes.verdict==='ok'?'b-ok':(ui.leakRes.verdict==='warn'?'b-warp':'b-block')}">${ui.leakRes.verdict==='ok'?'✓ УТЕЧЕК НЕ ОБНАРУЖЕНО':(ui.leakRes.verdict==='warn'?'⚠ ЕСТЬ РЕКОМЕНДАЦИИ':'✕ ОБНАРУЖЕНЫ ПРОБЛЕМЫ')}</span>
              <span class="mono" style="font-size:11px;color:var(--text-muted)">Пройдено: ${ui.leakRes.passed||0}/${ui.leakRes.total||0}</span>
            </div>
            ${(ui.leakRes.checks||[]).map(ch => `<div class="subtle" style="padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-color:${ch.status==='ok'?'rgba(16,185,129,0.35)':(ch.status==='warn'?'rgba(245,158,11,0.35)':'rgba(244,63,94,0.45)')}">
              <div><div style="font-size:12px;font-weight:700">${esc(ch.title)}</div><div style="font-size:11px;color:var(--text-muted);margin-top:2px">${esc(mask(ch.detail))}</div></div>
              <span class="badge ${ch.status==='ok'?'b-ok':(ch.status==='warn'?'b-warp':'b-block')}">${ch.status==='ok'?'OK':(ch.status==='warn'?'WARN':'FAIL')}</span>
            </div>`).join('')}
          </div>` : ''}
        </div>
        <div class="card">
          <div class="card-head"><h2 class="card-title">Диагностика сайта</h2></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input class="inp mono" style="flex:1;min-width:200px" value="${esc(ui.diagHost)}" oninput="ui.diagHost=this.value" onkeydown="if(event.key==='Enter')runDiag()" placeholder="2ip.io или youtube.com" />
            <button class="btn btn-primary" onclick="runDiag()">${ui.diagBusy?'Проверяем…':'Проверить сайт'}</button>
            <button class="btn" onclick="api('POST','dns/clear').then(()=>toast('Кэш DNS сброшен','#10B981'))">Сбросить DNS</button>
          </div>
          ${ui.diagRes ? `<pre class="subtle mono" style="margin-top:12px;padding:12px;font-size:11px;overflow:auto;max-height:220px;color:var(--text-secondary)">${esc(JSON.stringify(ui.diagRes, null, 2))}</pre>` : ''}
        </div>
        <div class="card">
          <div class="card-head">
            <div class="seg">
              <button class="${ui.logFilter==='all'?'act-vpn':''}" onclick="ui.logFilter='all';renderWorkspace()">Все</button>
              <button class="${ui.logFilter==='warn'?'act-warp':''}" onclick="ui.logFilter='warn';renderWorkspace()">Warn/Err</button>
              <button class="${ui.logFilter==='error'?'act-block':''}" onclick="ui.logFilter='error';renderWorkspace()">Ошибки</button>
            </div>
            <button class="btn btn-sm btn-primary" onclick="copyText((ui.state&&ui.state.log||[]).map(l=>l.time+' ['+l.level+'] '+l.msg).join('\\n'),'Журнал скопирован')">Копировать журнал</button>
          </div>
          <div style="max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:6px">
            ${logs.slice().reverse().map(l => `<div class="subtle mono" style="padding:7px 10px;font-size:11px;display:flex;gap:8px">
              <span style="color:var(--text-muted)">${esc(l.time||'')}</span>
              <span class="badge ${l.level==='error'?'b-block':(l.level==='warn'?'b-warp':'b-dpi')}">${esc((l.level||'info').toUpperCase())}</span>
              <span style="color:var(--text-primary)">${esc(mask(l.msg||''))}</span>
            </div>`).join('') || '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:12px">Журнал пуст</div>'}
          </div>
        </div>
      </div>`;
    }

    function renderWorkspace() {
      const root = document.getElementById('root');
      if (ui.ws === 'dashboard') { root.innerHTML = renderDashboard(); updateTraceBox(); }
      else if (ui.ws === 'routes') root.innerHTML = renderRoutes();
      else if (ui.ws === 'streams') root.innerHTML = renderStreams();
      else root.innerHTML = renderNetwork();
    }

    renderChrome();
    pollState().then(renderWorkspace);
    setInterval(pollState, 2000);
    setInterval(() => { if (ui.ws === 'streams' && !ui.streamPaused) loadTabData(); }, 2500);
  </script>
</body>
</html>
